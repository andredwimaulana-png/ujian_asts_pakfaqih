<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum 5 - POST Data ke API</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 450px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .15);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #28a745;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            background: #218838;
        }

        button:disabled {
            background: gray;
            cursor: not-allowed;
        }

        #hasilRespon {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-left: 5px solid #28a745;
            border-radius: 5px;
            white-space: pre-wrap;
            font-size: 14px;
        }

        .error {
            border-left: 5px solid red !important;
            color: red;
        }

        .success {
            border-left: 5px solid green !important;
            color: green;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>📤 Form Tambah Data Pengguna</h2>

        <form id="formUser">

            <label>Nama</label>
            <input type="text" id="nama" placeholder="Masukkan nama" required>

            <label>Email</label>
            <input type="email" id="email" placeholder="Masukkan email" required>

            <button type="submit" id="btnKirim">
                Kirim Data
            </button>

        </form>

        <pre id="hasilRespon">Belum ada data dikirim.</pre>

    </div>

    <script>

        const form = document.getElementById("formUser");
        const btn = document.getElementById("btnKirim");
        const hasil = document.getElementById("hasilRespon");

        form.addEventListener("submit", function (e) {

            e.preventDefault();

            btn.disabled = true;
            btn.innerText = "Mengirim...";

            hasil.className = "";
            hasil.innerText = "Sedang mengirim data...";

            const dataBaru = {

                name: document.getElementById("nama").value,
                email: document.getElementById("email").value

            };

            fetch("https://jsonplaceholder.typicode.com/users", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(dataBaru)

            })

                .then(response => response.json())

                .then(result => {

                    hasil.className = "success";

                    hasil.innerText =
                        `✅ Data Berhasil Dikirim

ID Baru : ${result.id}

Nama : ${result.name}
Email : ${result.email}`;

                    form.reset();

                })

                .catch(error => {

                    hasil.className = "error";

                    hasil.innerText =
                        "❌ Gagal mengirim data.\n\n" + error;

                })

                .finally(() => {

                    btn.disabled = false;
                    btn.innerText = "Kirim Data";

                });

        });

    </script>

</body>

</html>
