<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum 4 - Loading & Error Handling</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            width: 700px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .15);
            padding: 30px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: .3s;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: gray;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }

        .loading {
            background: #fff3cd;
            color: #856404;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        ul {
            list-style: none;
            margin-top: 20px;
        }

        li {
            padding: 12px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-left: 5px solid #007bff;
            border-radius: 6px;
            transition: .3s;
        }

        li:hover {
            transform: translateX(5px);
            background: #eef5ff;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid #ddd;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            display: inline-block;
            animation: putar 1s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes putar {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>📡 Loading & Error Handling API</h2>

        <button id="btn" onclick="loadData()">
            Ambil Data
        </button>

        <div id="status"></div>

        <ul id="daftarUser"></ul>

    </div>

    <script>

        function loadData() {

            const status = document.getElementById("status");
            const daftar = document.getElementById("daftarUser");
            const btn = document.getElementById("btn");

            btn.disabled = true;
            btn.innerText = "Loading...";

            status.style.display = "block";
            status.className = "loading";

            status.innerHTML =
                `<span class="spinner"></span>
Sedang mengambil data dari server...`;

            daftar.innerHTML = "";

            fetch("https://jsonplaceholder.typicode.com/users")

                .then(response => {

                    if (!response.ok) {

                        throw new Error("Status : " + response.status);

                    }

                    return response.json();

                })

                .then(data => {

                    status.className = "success";

                    status.innerHTML =
                        `✅ Berhasil memuat ${data.length} data pengguna.`;

                    let html = "";

                    data.forEach(item => {

                        html += `
<li>
<b>${item.name}</b><br>
📧 ${item.email}
</li>
`;

                    });

                    daftar.innerHTML = html;

                })

                .catch(error => {

                    status.className = "error";

                    status.innerHTML =
                        `❌ ${error.message}`;

                })

                .finally(() => {

                    btn.disabled = false;
                    btn.innerText = "Ambil Data";

                });

        }

    </script>

</body>

</html>
