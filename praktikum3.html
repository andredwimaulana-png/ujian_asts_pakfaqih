<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum 3 - Tabel API</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6f9;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .15);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: .3s;
        }

        button:hover {
            background: #3d9441;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            display: none;
        }

        th {
            background: #4CAF50;
            color: white;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        tbody tr:hover {
            background: #f1f1f1;
        }

        td:first-child {
            text-align: center;
            font-weight: bold;
        }

        @media(max-width:768px) {

            body {
                padding: 15px;
            }

            table {
                font-size: 14px;
            }

        }
    </style>

</head>

<body>

    <div class="container">

        <h2>📋 Daftar Pengguna (JSONPlaceholder API)</h2>

        <button onclick="loadData()">
            Muat Data
        </button>

        <p id="status"></p>

        <table id="tabelUser">

            <thead>

                <tr>

                    <th>No</th>
                    <th>Nama</th>
                    <th>Email</th>
                    <th>Kota</th>
                    <th>Perusahaan</th>

                </tr>

            </thead>

            <tbody id="isiTabel"></tbody>

        </table>

    </div>

    <script>

        function loadData() {

            const status = document.getElementById("status");

            status.style.color = "#555";
            status.innerHTML = "⏳ Mengambil data dari server...";

            fetch("https://jsonplaceholder.typicode.com/users")

                .then(response => {

                    if (!response.ok) {

                        throw new Error("Status : " + response.status);

                    }

                    return response.json();

                })

                .then(data => {

                    let html = "";

                    data.forEach((item, index) => {

                        html += `

<tr>

<td>${index + 1}</td>

<td>${item.name}</td>

<td>${item.email}</td>

<td>${item.address.city}</td>

<td>${item.company.name}</td>

</tr>

`;

                    });

                    document.getElementById("isiTabel").innerHTML = html;

                    document.getElementById("tabelUser").style.display = "table";

                    status.style.color = "green";

                    status.innerHTML = `✅ Berhasil memuat ${data.length} data pengguna.`;

                })

                .catch(error => {

                    status.style.color = "red";

                    status.innerHTML = "❌ Gagal mengambil data.<br>" + error.message;

                });

        }

    </script>

</body>

</html>
